# Runs the tests and the offline evaluation on every push to GitHub.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Offline evaluation (baseline, no AI)
        run: python -m evals.run --config offline --split dev
